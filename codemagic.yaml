workflows:
  android-capacitor:
    name: Planilha de Vacinação - Android (APK)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      node: 20
      java: 17
      vars:
        PACKAGE_NAME: "com.dionatas.planilhavacinacao"
    scripts:
      - name: Instalar dependências do projeto
        script: |
          npm install
      - name: Adicionar a plataforma Android (se ainda não existir)
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Gerar ícone do app a partir de resources/icon.png
        script: |
          npx @capacitor/assets generate --android --iconBackgroundColor '#F4EFDE' --iconBackgroundColorDark '#F4EFDE'
      - name: Sincronizar o Capacitor
        script: |
          npx cap sync android
      - name: Gerar APK de debug (instalável direto no celular)
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk
    
